                            container.insertBefore(draggedElement, this.nextSibling);
                        } else {
                            container.insertBefore(draggedElement, this);
                        }

                        // Update the room order in localStorage
                        const floor = draggedFloor;
                        const newOrder = Array.from(container.querySelectorAll('.room-card'))
                            .map(card => card.dataset.roomName)
                            .filter(name => name); // Filter out any undefined

                        roomOrder[floor] = newOrder;
                        saveRoomOrder();
                        showToast('Room order saved');
                    }

                    this.classList.remove('drag-over');
                    return false;
                });
            });
        }

        function toggleRoom(roomName, event) {
            // Stop propagation if event provided (to prevent conflicts with other clicks)
            if (event) {
                event.stopPropagation();
            }

            // Toggle room state
            const newState = !roomStates[roomName];
            roomStates[roomName] = newState;
            saveRoomStates();
            renderRooms();

            // If we just expanded the room, trigger a getStatus to refresh visible info
            if (!newState) {
                // debounce to avoid multiple calls in quick succession
                if (!toggleRoom._debounce) toggleRoom._debounce = {};
                if (!toggleRoom._debounce[roomName]) {
                    toggleRoom._debounce[roomName] = true;
                    setTimeout(() => { getStatus(roomName); toggleRoom._debounce[roomName] = false; }, 250);
                }
            }
        }

        function collapseAllRooms() {
            // Set all rooms to collapsed
            configData.rooms.forEach(room => {
                if (room.loads.length > 0) { // Only rooms with content
                    roomStates[room.name] = true;
                }
            });
            saveRoomStates();
            renderRooms();
            showToast('All rooms collapsed');
        }

        function expandAllRooms() {
            // Clear all collapsed states
            configData.rooms.forEach(room => {
                roomStates[room.name] = false;
            });
            saveRoomStates();
            renderRooms();
            showToast('All rooms expanded');
        }

        function toggleFloor(floor) {
            floorStates[floor] = !floorStates[floor];
            renderRooms();
        }

        function toggleAllFloors() {
            const allExpanded = Object.values(floorStates).every(s => s);
            Object.keys(floorStates).forEach(floor => {
                floorStates[floor] = !allExpanded;
            });
            renderRooms();
        }

        // Polling function to update load levels and LED states
        async function pollLoadStatus(forceRefresh = true) {
            if (!configData) return;

            try {
                await updateActiveLoads({ force: forceRefresh });
            } catch (error) {
                console.error('Failed to refresh load snapshot', error);
            }

            // Poll LED states for all stations
            await pollLEDStates();
        }

        async function pollLEDStates() {
            try {
                const response = await fetch('/api/leds');
                if (response.ok) {
                    const data = await response.json();
                    // data.stations contains { "V23": { "1": "on", "2": "off", ... }, ... }
                    for (const [stationId, buttons] of Object.entries(data.stations)) {
                        const stationNum = parseInt(stationId.substring(1)); // "V23" -> 23
                        updateStationLEDs(stationNum, buttons, null);
                    }
                }
            } catch (error) {
                console.error('Failed to poll LED states:', error);
            }
        }

        function updateStationLEDs(station, buttonStates, ledStates) {
            if (!configData || !Array.isArray(configData.rooms)) return;

            const normalized = new Array(8).fill('off');

            if (buttonStates && typeof buttonStates === 'object') {
                for (const [key, value] of Object.entries(buttonStates)) {
                    const index = Number(key);
                    if (!Number.isInteger(index) || index < 1 || index > 8) continue;

                    let state;
                    if (typeof value === 'string') {
                        state = value.toLowerCase();
                    } else if (value === 1 || value === true) {
                        state = 'on';
                    } else if (value === 2) {
                        state = 'blink';
                    } else {
                        state = 'off';
                    }

                    if (state === 'on' || state === 'blink' || state === 'off') {
                        normalized[index - 1] = state;
                    }
                }
            } else if (Array.isArray(ledStates) && ledStates.length >= 8) {
                ledStates.forEach((value, idx) => {
                    const numeric = Number(value);
                    if (Number.isNaN(numeric)) return;
                    if (numeric >= 200) normalized[idx] = 'on';
                    else if (numeric >= 100) normalized[idx] = 'blink';
                    else if (numeric > 0) normalized[idx] = 'on';
                    else normalized[idx] = 'off';
                });
            } else {
                return;
            }

            const applyLedStateToButton = (button, state) => {
                if (!button) return;
                button.classList.remove('led-on', 'led-blink', 'active');
                button.dataset.ledState = state;
                if (state === 'on') {
                    button.classList.add('led-on', 'active');
                } else if (state === 'blink') {
                    button.classList.add('led-blink', 'active');
                }
            };

            configData.rooms.forEach(room => {
                const roomId = room.name.replace(/\s+/g, '-').toLowerCase();

                let roomMatches = false;
                if (room.station && Number(room.station) === Number(station)) {
                    roomMatches = true;
                }

                if (!roomMatches && Array.isArray(room.stations)) {
                    for (const st of room.stations) {
                        try {
                            const stNum = Number(st.station || st);
                            if (!Number.isNaN(stNum) && stNum === Number(station)) {
                                roomMatches = true;
                                break;
                            }
                        } catch (e) {
                            // ignore malformed station entries
                        }
                    }
                }

                if (!roomMatches) return;

                for (let btnNum = 1; btnNum <= 8; btnNum++) {
                    const state = normalized[btnNum - 1] || 'off';
                    const selectors = [
                        `#scene-${roomId}-${station}-${btnNum}`,
                        `#scene-${roomId}-${btnNum}`,
                    ];

                    selectors.forEach(selector => {
                        document.querySelectorAll(selector).forEach(button => {
                            applyLedStateToButton(button, state);
                        });
                    });
                }
            });
        }

        function parseLoadLevel(response) {
            // Handle various response formats
            let level = 0;

            if (typeof response === 'number') {
                level = response;
            } else if (typeof response === 'string') {
                // Try to extract number from "R:V258" format
                const match = response.match(/\d+/);
                level = match ? parseInt(match[0]) : 0;
            }

            // Vantage uses 0-255 scale, convert to 0-100 percentage
            if (level > 100) {
                level = Math.round((level / 255) * 100);
            }

            return level;
        }

        function toggleSlider(loadId) {
            const sliderSection = document.getElementById(`${loadId}-slider-section`);
            if (sliderSection) {
                sliderSection.classList.toggle('expanded');
            }
        }

        function updateSliderPreview(loadId, value) {
            const badge = document.getElementById(`load-${loadId}-badge`);
            if (badge) {
                badge.textContent = `Level: ${value}%`;
            }
        }

        function toggleLoads(roomId) {
            const loadsSection = document.getElementById(`${roomId}-loads`);
            const toggleIcon = loadsSection?.previousElementSibling?.querySelector('.loads-toggle-icon');

            if (loadsSection) {
                loadsSection.classList.toggle('collapsed');
            }

            if (toggleIcon) {
                toggleIcon.classList.toggle('collapsed');
            }

            // Save state to localStorage
            const visible = !loadsSection?.classList.contains('collapsed');
            loadsVisibility[roomId] = visible;
            saveLoadsVisibility();

            // If we just expanded the loads section, trigger getStatus for the room
            if (visible) {
                // roomId is slugified room name; convert back to original by finding match
                const room = configData.rooms.find(r => r.name.replace(/\s+/g, '-').toLowerCase() === roomId);
                if (room) {
                    // Debounce to avoid duplicate calls
                    if (!toggleLoads._debounce) toggleLoads._debounce = {};
                    if (!toggleLoads._debounce[roomId]) {
                        toggleLoads._debounce[roomId] = true;
                        setTimeout(() => { getStatus(room.name); toggleLoads._debounce[roomId] = false; }, 200);
                    }
                }
            }
        }

        function minimizeAllLoads() {
            if (!configData) return;

            // Collapse all loads sections
            configData.rooms.forEach(room => {
                const roomId = room.name.replace(/\s+/g, '-').toLowerCase();
                loadsVisibility[roomId] = false;
            });

            saveLoadsVisibility();
            renderRooms();
            showToast('All loads minimized');
        }

        function updateRoomActiveState(roomName) {
            if (!roomName) return;
            const roomCard = document.querySelector(`.room-card[data-room-name="${roomName}"]`);
            if (!roomCard) return;

            const loadIds = roomLoadsMap[roomName] || [];
            const activeCount = loadIds.reduce((count, id) => {
                const level = Number(loadLevels[id]);
                return count + (Number.isNaN(level) ? 0 : (level > 0 ? 1 : 0));
            }, 0);

            roomCard.classList.toggle('room-active', activeCount > 0);
            const badge = roomCard.querySelector('.room-active-badge');
            if (badge) {
                badge.textContent = activeCount > 0 ? `${activeCount} on` : '';
                badge.classList.toggle('show', activeCount > 0);
            }
        }

        function updateLoadStatus(loadId, level) {
            const numericLevel = Number(level);
            const hasLevel = !Number.isNaN(numericLevel);
            if (hasLevel) {
                loadLevels[loadId] = numericLevel;
            } else {
                delete loadLevels[loadId];
            }

            const badge = document.getElementById(`load-${loadId}-badge`);
            if (badge) {
                badge.textContent = `Level: ${level}%`;
            }

            const sliderEl = document.getElementById(`load-${loadId}-slider`);
            if (sliderEl) {
                sliderEl.value = level;
            }

            const loadEl = document.getElementById(`load-${loadId}`);
            if (loadEl) {
                loadEl.classList.toggle('load-active', hasLevel && numericLevel > 0);
                const onBtn = loadEl.querySelector('.btn-on');
                const offBtn = loadEl.querySelector('.btn-off');
                if (onBtn && offBtn) {
                    const isOn = hasLevel && numericLevel > 0;
                    const isOff = hasLevel && numericLevel <= 0;

                    onBtn.disabled = hasLevel && isOn;
                    offBtn.disabled = hasLevel && isOff;

                    onBtn.classList.toggle('btn-selected', isOn);
                    offBtn.classList.toggle('btn-selected', isOff);

                    if (!hasLevel) {
                        onBtn.disabled = false;
                        offBtn.disabled = false;
                        onBtn.classList.remove('btn-selected');
                        offBtn.classList.remove('btn-selected');
                    }
                }
            }

            const roomName = loadToRoomMap[loadId];
            if (roomName) {
                updateRoomActiveState(roomName);
            }
        }

        function applyLoadLevels(loadMap) {
            if (!loadMap || typeof loadMap !== 'object') return;

            Object.entries(loadMap).forEach(([id, level]) => {
                const numericId = Number(id);
                if (!Number.isNaN(numericId)) {
                    updateLoadStatus(numericId, level);
                }
            });

            hasFullLoadSnapshot = true;
            lastLoadSnapshotAt = Date.now();
        }

        function refreshStatus() {
            updateActiveLoads({ force: true });
            pollVisibleLEDs();
            checkHealth();
            showToast('Refreshing status...');
        }

        function startPolling() {
            // Use aggregated load polling with throttled force refreshes
            pollLoadStatus(true);

            // Previously disabled due to TIME_WAIT build-up on the controller.
            // The bridge now serializes LED polling requests, keeping connection counts low.
            startLEDPolling();
        }

        // LED Polling - Poll only visible stations
        let ledPollInterval = null;

        function getVisibleStations() {
            const visibleStations = new Set();
            const buttons = document.querySelectorAll('.scene-btn');

            buttons.forEach(btn => {
                const isVisible = btn.offsetParent !== null;
                if (!isVisible) return;

                const match = btn.id.match(/scene-[^-]+-(\d+)-\d+/);
                if (match) {
                    visibleStations.add(parseInt(match[1], 10));
                    return;
                }

                // Legacy format scene-roomId-buttonNum
                const stationSection = btn.closest('.scene-section');
                if (!stationSection) return;
                const label = stationSection.querySelector('.scene-label');
                if (!label) return;
                const labelMatch = label.textContent.match(/V(\d+)/);
                if (labelMatch) {
                    visibleStations.add(parseInt(labelMatch[1], 10));
                }
            });

            return Array.from(visibleStations);
        }

        async function pollVisibleLEDs() {
            const stations = getVisibleStations();

            if (stations.length === 0) return;

            // Poll each visible station
            for (const station of stations) {
                try {
                    const response = await fetch(`/api/leds/${station}`);
                    if (response.ok) {
                        const data = await response.json();
                        updateStationLEDs(station, data.button_states, data.leds);
                    }
                } catch (error) {
                    console.error(`Failed to poll LED state for station ${station}:`, error);
                }
            }
        }

        function startLEDPolling() {
            if (ledPollInterval) return;
            // Poll every 2 seconds
            ledPollInterval = setInterval(pollVisibleLEDs, 2000);

            // Initial poll
            pollVisibleLEDs();

            // Pause polling when tab is hidden (save resources)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (ledPollInterval) {
                        clearInterval(ledPollInterval);
                        ledPollInterval = null;
                    }
                } else {
                    // Resume polling when tab becomes visible
                    if (!ledPollInterval) {
                        ledPollInterval = setInterval(pollVisibleLEDs, 2000);
                        pollVisibleLEDs(); // Immediate poll
                    }
                }
            });
        }

        window.addEventListener('resize', () => {
            const panel = document.getElementById('activeLoadsPanel');
            if (panel && panel.classList.contains('show')) {
                positionActiveLoadsPanel();
            }
        });

        window.addEventListener('scroll', () => {
            const panel = document.getElementById('activeLoadsPanel');
            if (panel && panel.classList.contains('show')) {
                positionActiveLoadsPanel();
            }
        }, { passive: true });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Health check
        async function checkHealth() {
            try {
                const response = await fetch('/healthz');
                const statusDot = document.querySelector('.status-dot');
                if (response.ok) {
                    statusDot.style.background = '#4ade80';
                    statusDot.style.boxShadow = '0 0 15px #4ade80';
                } else {
                    statusDot.style.background = '#f59e0b';
                    statusDot.style.boxShadow = '0 0 15px #f59e0b';
                }
            } catch (error) {
                const statusDot = document.querySelector('.status-dot');
                statusDot.style.background = '#ef4444';
                statusDot.style.boxShadow = '0 0 15px #ef4444';
            }
        }

        // Initialize on load
        init();
        setInterval(checkHealth, 10000);
        checkHealth();

        // Implement 'Get Status' functionality
        async function getStatus(roomName) {
            const room = configData.rooms.find(r => r.name === roomName);
            if (!room) {
                showToast(`Room not found: ${roomName}`, true);
                return;
            }

            // find the button and set loading state (use getAttribute for exact match)
            const headerCard = Array.from(document.querySelectorAll('.room-card'))
                .find(rc => rc.getAttribute('data-room-name') === roomName);
            const headerBtn = headerCard ? headerCard.querySelector('.room-get-status') : null;
            console.debug('getStatus: roomName=', roomName, 'headerCard=', headerCard, 'headerBtn=', headerBtn);
            if (headerBtn) headerBtn.classList.add('loading');

            try {
                // Poll load levels sequentially with a small delay to avoid flooding the bridge
                for (const load of room.loads) {
                    try {
                        const response = await fetch(`/load/${load.id}/status`);
                        const raw = await response.text();
                        console.debug('getStatus: load', load.id, 'rawResponse=', raw);
                        if (response.ok) {
                            const data = JSON.parse(raw);
                            const level = parseLoadLevel(data.resp);
                            updateLoadStatus(load.id, level);
                        } else {
                            console.error(`Failed to get status for load ${load.id}: ${response.status}`);
                        }
                    } catch (e) {
                        console.error('getStatus: error fetching load', load.id, e);
                    }
                    // small pause between requests
                    await new Promise(r => setTimeout(r, 60));
                }

                // Poll LED states for the room's stations
                for (const station of room.stations || []) {
                    try {
                        const response = await fetch(`/api/leds/${station.station}`);
                        if (response.ok) {
                            const data = await response.json();
                            updateStationLEDs(Number(station.station), data.button_states, data.leds);
                        } else {
                            console.error(`Failed to get LED status for station ${station.station}: ${response.status}`);
                        }
                    } catch (e) {
                        console.error('getStatus: error fetching LED status for station', station.station, e);
                    }
                    // small pause between requests
                    await new Promise(r => setTimeout(r, 60));
                }
                showToast(`Status updated for ${roomName}`);
                console.debug('getStatus: completed for', roomName);
                if (headerBtn) headerBtn.classList.remove('loading');
            } catch (error) {
                showToast(`Failed to get status for ${roomName}`, true);
                console.error(`Error getting status for ${roomName}:`, error);
                if (headerBtn) headerBtn.classList.remove('loading');
            }
        }

        // Toggle active loads panel
        function toggleActiveLoadsPanel() {
            const panel = document.getElementById('activeLoadsPanel');
            const overlay = document.getElementById('activeLoadsOverlay');
            if (!panel) return;

            const willShow = !panel.classList.contains('show');
            panel.classList.toggle('show');
            if (overlay) {
                overlay.classList.toggle('show', willShow);
                overlay.onclick = (e) => {
                    if (e.target === overlay) {
                        panel.classList.remove('show');
                        overlay.classList.remove('show');
                    }
                };
            }

            if (willShow) {
                positionActiveLoadsPanel();
                updateActiveLoads({ force: true });
            }
        }

        function positionActiveLoadsPanel() {
            const panel = document.getElementById('activeLoadsPanel');
            const trigger = document.querySelector('.quick-status-btn');
            const overlay = document.getElementById('activeLoadsOverlay');
            if (!panel || !trigger || !overlay) return;

            const rect = trigger.getBoundingClientRect();
            const top = rect.bottom + 8 + window.scrollY;
            const right = Math.max(12, window.innerWidth - rect.right - 4);

            panel.style.top = `${top}px`;
            panel.style.right = `${right}px`;
        }

        // Update active loads display
        async function updateActiveLoads(options = {}) {
            const force = options.force === true;
            const panel = document.getElementById('activeLoadsPanel');
            const panelOpen = panel && panel.classList.contains('show');
            const now = Date.now();
            const forceInterval = panelOpen ? ACTIVE_LOADS_FORCE_WHEN_OPEN_MS : ACTIVE_LOADS_FORCE_MS;
            const shouldForce = force || !lastActiveLoadsForce || (now - lastActiveLoadsForce) > forceInterval;

            if (activeLoadsPromise) {
                return activeLoadsPromise;
            }

            const url = shouldForce ? '/api/loads?force=true' : '/api/loads';

            activeLoadsPromise = (async () => {
                try {
                    const data = await fetchLoadsData(url);
                    const loads = data.loads || {};

                    applyLoadLevels(loads);
                    if (viewFilter === 'active' && shouldForce) {
                        renderRooms();
                    }

                    // Find active loads (level > 0)
                    const activeLoads = [];
                    if (configData && Array.isArray(configData.rooms)) {
                        for (const [id, level] of Object.entries(loads)) {
                            const numericLevel = Number(level);
                            const numericId = parseInt(id, 10);
                            if (Number.isNaN(numericId) || numericLevel <= 0) continue;

                            const room = configData.rooms.find(r => r.loads?.some(l => l.id === numericId));
                            const load = room?.loads?.find(l => l.id === numericId);
                            if (room && load) {
                                activeLoads.push({
                                    id: numericId,
                                    name: load.name,
                                    room: room.name,
                                    level: numericLevel,
                                    type: load.type
                                });
                            }
                        }
                    }

                    // Update UI
                    const countEl = document.getElementById('activeCount');
                    const listEl = document.getElementById('activeLoadsList');
                    if (countEl) {
                        countEl.textContent = activeLoads.length;
                    }

                    if (listEl) {
                        if (activeLoads.length === 0) {
                            listEl.innerHTML = '<div class="no-active-loads"><div class="icon">✓</div><div>All lights off</div></div>';
                        } else {
                            listEl.innerHTML = activeLoads.map(load => {
                                const escapedRoom = load.room.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                const escapedName = load.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                return `
                        <div class="active-load-item">
                            <div class="load-info">
                                <div class="load-room">${load.room}</div>
                                <div class="load-name">${load.name}</div>
                            </div>
                            <div class="load-level">
                                <span class="level-badge">${load.level}%</span>
                                <button class="quick-off-btn" onclick="setLevel(${load.id}, 0, '${escapedRoom}', '${escapedName}')">OFF</button>
                            </div>
                        </div>
                        `;
                            }).join('');
                        }
                    }

                    const lastUpdateEl = document.getElementById('lastUpdate');
                    if (lastUpdateEl && shouldForce) {
                        lastUpdateEl.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                    }

                    if (shouldForce) {
                        lastActiveLoadsForce = Date.now();
                    }
                } catch (error) {
                    console.error('Failed to update active loads', error);
                } finally {
                    activeLoadsPromise = null;
                }
            })();

            return activeLoadsPromise;
        }

        // Start active loads updates
        setInterval(() => updateActiveLoads(), 3000);
        setTimeout(() => updateActiveLoads({ force: true }), 700); // Initial update after config loads
    </script>
</body>

</html>
